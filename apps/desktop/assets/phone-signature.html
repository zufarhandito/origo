<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Origo - Gambar tanda tangan</title>
<style>body{font:16px system-ui;margin:32px auto;padding:0 20px;max-width:650px;background:#fafafa;color:#181818}h1{font-size:22px}canvas{width:100%;aspect-ratio:2/1;background:white;border:1px solid #bbb;border-radius:10px;touch-action:none}button{font:inherit;padding:12px 18px;border:1px solid #ccc;border-radius:8px;background:white;margin:8px 8px 0 0}button:last-of-type{background:#191919;color:white}p{color:#555;line-height:1.5}</style>
<h1>Gambar tanda tangan</h1><p>Gunakan jari atau stylus. Gambar dikirim langsung ke Origo di komputer melalui jaringan lokal. PDF tetap di komputer.</p><canvas width="1024" height="512" aria-label="Area gambar tanda tangan"></canvas><div><button id="undo">Undo</button><button id="clear">Hapus semua</button><button id="send">Kirim ke Origo</button></div><p id="status" role="status">Sesi berlaku 5 menit. Gunakan jaringan yang Anda percaya.</p>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');let strokes=[],active=null,sending=false,done=false;
function redraw(){ctx.clearRect(0,0,1024,512);ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#191919';for(const s of strokes){ctx.beginPath();s.forEach((p,i)=>i?ctx.lineTo(p[0]*1024,p[1]*512):ctx.moveTo(p[0]*1024,p[1]*512));ctx.stroke();}}
function point(e){const b=canvas.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-b.left)/b.width)),Math.max(0,Math.min(1,(e.clientY-b.top)/b.height))];}
canvas.onpointerdown=e=>{if(done||sending||active!==null||strokes.length>=128)return;e.preventDefault();active=e.pointerId;canvas.setPointerCapture(e.pointerId);strokes.push([point(e)]);redraw();};
canvas.onpointermove=e=>{if(e.pointerId!==active)return;const s=strokes.at(-1);if(s.length<1024 && strokes.reduce((n,s)=>n+s.length,0)<16384)s.push(point(e));redraw();};
function end(e){if(e.pointerId!==active)return;active=null;redraw();}canvas.onpointerup=end;canvas.onpointercancel=end;
document.querySelector('#undo').onclick=()=>{if(!sending&&!done){active=null;strokes.pop();redraw();}};
document.querySelector('#clear').onclick=()=>{if(!sending&&!done){strokes=[];active=null;redraw();}};
document.querySelector('#send').onclick=async()=>{if(sending||done)return;if(active!==null){status.textContent='Angkat jari dari area gambar sebelum mengirim.';return;}if(!strokes.some(s=>s.length>1)){status.textContent='Gambar tanda tangan terlebih dahulu.';return;}sending=true;status.textContent='Mengirim...';try{const r=await fetch(location.pathname+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(strokes)});if(!r.ok)throw Error();done=true;status.textContent='Terkirim. Periksa preview di Origo, lalu pilih Gunakan. Anda boleh menutup halaman ini.';document.querySelectorAll('button').forEach(b=>b.disabled=true);}catch{status.textContent='Tidak terkirim. Pastikan komputer terhubung dan sesi belum dibatalkan/kedaluwarsa. Anda dapat mencoba lagi.';}finally{sending=false;}};
</script></html>
