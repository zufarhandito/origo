name: Windows M1 checks
on: [push, pull_request, workflow_dispatch]
jobs:
  native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Activate MSVC x64
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC tools missing' }
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'WindowsSdkDir', 'WindowsSDKVersion')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
      - name: Install pinned toolchain
        run: rustup show
      - name: Quality gates
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Prepare native engines
        shell: pwsh
        run: |
          ./scripts/new-fixture.ps1
          ./scripts/fetch-sidecars.ps1
      - name: Real native integration (must not skip)
        shell: pwsh
        run: |
          ./scripts/test-sidecars.ps1
          ./scripts/smoke-test.ps1
      - name: Generated book sessions (native, no GPU)
        shell: pwsh
        run: cargo run --release --locked -p pdf-smoke -- --benchmark-books

