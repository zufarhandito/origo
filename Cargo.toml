[workspace]
resolver = "3"
members = ["apps/desktop", "apps/smoke", "crates/domain", "crates/application", "crates/pdf-engine", "crates/qpdf-adapter"]
default-members = ["crates/application", "crates/pdf-engine", "crates/qpdf-adapter", "apps/smoke"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "=1.0.100"
thiserror = "=2.0.17"
image = { version = "=0.25.8", default-features = false }
smallvec = "=1.15.1"
tempfile = "=3.23.0"
dunce = "=1.0.5"
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_8125", "thread_safe"] }
gpui-kit = "=0.9.1"
pdf-application = { path = "crates/application" }
pdf-domain = { path = "crates/domain" }
pdf-engine = { path = "crates/pdf-engine" }
qpdf-adapter = { path = "crates/qpdf-adapter" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

